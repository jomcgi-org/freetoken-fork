# node-4: selected ordinary-serving runtime, installed as
# /etc/systemd/system/freetoken-serve.service.d/50-selected-runtime.conf
[Service]
WorkingDirectory=/var/lib/longhorn/nvme-02/freetoken/wt-astra-selected-serving
Environment=PYTHONPATH=/var/lib/longhorn/nvme-02/freetoken/wt-astra-selected-serving/python
Environment=FREETOKEN_DECODE_PREFIX_SNAPSHOT=0
Environment=FREETOKEN_CONTINUATION_TRACE_DIR=
Environment=FREETOKEN_HOT_HOST_CACHE_CENSUS_DIR=
Environment=FREETOKEN_PREFILL_SELECTIVE_MAX_TOKENS=128
Environment=FREETOKEN_PREFILL_HOT_OVERLAP=0
ExecStart=
ExecStart=/var/lib/longhorn/nvme-02/freetoken/wt-plegather/.venv/bin/ft serve \
  --model /var/lib/longhorn/nvme-02/freetoken/models/flash-e2m1.ftw \
  --moe-backend offload --moe-cache-auto \
  --max-running-requests 1 --linear-state-cache-ratio 4.0 \
  --max-extend-length 2048 --max-seq-len-override 100352 \
  --host 127.0.0.1 --port 8090 \
  --moe-disk-prefill staged --moe-prefill-hot-split on \
  --moe-prefill-split-kernel grouped --moe-bank-hugepages off \
  --moe-cpu-threads 14 --ple-backend uring --enable-cache-report \
  --moe-disk-layer-profile /var/lib/longhorn/nvme-02/freetoken/layer-profile-v3.json \
  --moe-hot-expert-budget-gib 6 --moe-hot-adapt-interval-steps auto \
  --served-model-name qwen3.6-27b --moe-cpu-willneed recent \
  --moe-hot-adapt-prefill-weight 0.1 --moe-hot-adapt-histories split \
  --moe-hot-adapt-aim phase \
  --kv-disk-cache-dir /var/lib/longhorn/nvme-02/freetoken/prefix-cache \
  --kv-disk-cache-gib 0 --moe-hot-plan-persist off --cache-type radix \
  --kv-ladder off --kv-reserve-tokens 65536 --cuda-graph-max-bs 1 \
  --moe-disk-prefill-io buffered --moe-hot-staging-io mmap \
  --moe-hot-host-cache reclaim
# Stop only this service's processes, including its model worker.
ExecStopPost=
KillMode=control-group
